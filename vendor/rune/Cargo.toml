[workspace]
resolver = "3"
members = ["crates/rune", "crates/rune-motion", "crates/rune-staging", "crates/rune-taffy", "crates/procwatch"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.lints.rust]
# shared-lints begin
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
# shared-lints end
unsafe_code = "allow" # shared: forbid; GPU and FFI code needs unsafe

[workspace.lints.clippy]
# shared-lints begin
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
disallowed_types = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
# shared-lints end
undocumented_unsafe_blocks = "warn" # shared: deny; errors left
let_underscore_must_use = "warn" # shared: deny; errors left
disallowed_methods = "warn" # shared: deny; errors left

[profile.dev]
# Tests and debug builds keep line tables for backtraces; full debug info only slows codegen
# and linking of this large crate.
debug = "line-tables-only"

[profile.test]
# The test crate holds every test's view and state; without line tables its code generation
# peaks 1.14x lower (11.8 GB to 10.4 GB at 4 jobs). Dependencies keep the dev profile's.
debug = false
