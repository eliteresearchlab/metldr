[package]
name = "metldr-answer-codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.fast]
# Edit and check builds (`METLDR_PROFILE=fast`): the release profile with thin LTO, parallel
# codegen and incremental compilation. Packaged and measured builds keep `release`.
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true


[features]
default = []
guest = []

[dependencies]
metldr-conversation = { path = "../metldr-conversation" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.128"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
