[package]
name = "metldr-claude-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
memchr = "=2.8.3"
tokio = { version = "=1.53.1", features = ["rt", "process", "io-util", "time", "macros"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
