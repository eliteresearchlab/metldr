[package]
name = "metldr-sse"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace]

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[dependencies]
memchr = "=2.8.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.1", features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.105"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = [
  "AbortController",
  "AbortSignal",
  "Headers",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "ReferrerPolicy",
  "RequestCache",
  "RequestCredentials",
  "RequestInit",
  "RequestRedirect",
  "Response",
] }
