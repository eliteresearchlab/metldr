[package]
name = "metldr-welcome"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "welcome_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = [
  "AbortController", "AbortSignal", "Document", "Element", "Event",
  "EventTarget", "HtmlSelectElement", "HtmlInputElement", "HtmlElement", "Node", "NodeList",
  "IntersectionObserver", "IntersectionObserverEntry", "Location", "Window", "HtmlCanvasElement",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlUniformLocation", "MediaQueryList",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.fast]
# Edit and check builds (`METLDR_PROFILE=fast`): the release profile without LTO, with parallel
# codegen and incremental compilation. Packaged and measured builds keep `release`.
inherits = "release"
lto = false
codegen-units = 16
incremental = true


[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
