[package]
name = "metldr-core"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.fast]
# Edit and check builds (`METLDR_PROFILE=fast`): the release profile with thin LTO, parallel
# codegen and incremental compilation. Packaged and measured builds keep `release`.
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true


[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
