[package]
name = "metldr-core"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
metldr-embed = { path = "../metldr-embed" }
py3langid = { path = "../../vendor/py3langid" }
metldr-retrieval = { path = "../metldr-retrieval" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = { version = "=0.2.128", optional = true }

[features]
# The extension's own core module: the gateway, model store, search and stats in the browser.
# Without it the core is its shared tables and on-device models, for any crate to link.
web = [
  "dep:wasm-bindgen",
  "dep:js-sys",
  "dep:metldr-chat-completions",
  "dep:metldr-conversation",
  "dep:metldr-google-interactions",
  "dep:metldr-messages",
  "dep:metldr-responses",
  "dep:metldr-sse",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "=0.3.105", optional = true }
metldr-chat-completions = { path = "../metldr-chat-completions", optional = true }
metldr-conversation = { path = "../metldr-conversation", optional = true }
metldr-google-interactions = { path = "../metldr-google-interactions", optional = true }
metldr-messages = { path = "../metldr-messages", optional = true }
metldr-responses = { path = "../metldr-responses", optional = true }
metldr-sse = { path = "../metldr-sse", optional = true }
wasm-bindgen-futures = { version = "=0.4.78", optional = true }
web-sys = { version = "=0.3.105", optional = true, features = [
  "AbortSignal",
  "Crypto",
  "CryptoKey",
  "DomStringList",
  "Headers",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbIndex",
  "IdbKeyRange",
  "IdbObjectStoreParameters",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "RequestCache",
  "RequestCredentials",
  "RequestInit",
  "RequestRedirect",
  "Response",
  "SubtleCrypto",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.fast]
# Edit and check builds (`METLDR_PROFILE=fast`): the release profile without LTO, with parallel
# codegen and incremental compilation. Packaged and measured builds keep `release`.
inherits = "release"
lto = false
codegen-units = 16
incremental = true


[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
