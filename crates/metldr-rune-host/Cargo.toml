[package]
name = "metldr-rune-host"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
version = "0.1.0"
edition = "2024"

# Own workspace: the Rune renderer stays out of the shipping panel module.
[workspace]

# Mirrors the shipping panel's release profile so sizes are comparable, plus two size settings.
# The host has no catch_unwind, and wasm32 already aborts on panic, so `panic = "abort"` changes no
# behaviour there. `strip = "symbols"` drops the function-name section from the module.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[lib]
crate-type = ["cdylib"]

[features]
# Rune renderer for the wasm build (`make rune-host`). Native tests run without it.
renderer = ["dep:rune"]

[dependencies]
rune = { path = "../../vendor/rune/crates/rune", optional = true, default-features = false, features = ["accessibility", "webgl"] }
js-sys = "=0.3.105"
wasm-bindgen = "=0.2.128"
web-sys = { version = "=0.3.105", features = ["Performance", "Window"] }

[lints.rust]
unsafe_code = "forbid"
