[package]
name = "metldr-system-one"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace]

[dependencies]
metldr-sse = { path = "../metldr-sse" }
reqwest = { version = "=0.13.5", default-features = false }
