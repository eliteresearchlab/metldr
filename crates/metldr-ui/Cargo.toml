[package]
name = "metldr-ui"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0 AND Apache-2.0"
publish = false
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
rune = { path = "../../vendor/rune/crates/rune", default-features = false, features = ["accessibility", "svg", "webgl"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.105"
