[package]
name = "metldr-panel"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
version = "0.1.0"
edition = "2024"

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[lib]
crate-type = ["cdylib"]

[features]
rune-ui = ["dep:rune", "dep:wgpu"]

[dependencies]
metldr-harness = { path = "../metldr-harness" }
rune = { path = "../../vendor/rune/crates/rune", optional = true, default-features = false, features = ["accessibility", "svg", "webgl"] }
wgpu = { version = "~30.0.1", optional = true, default-features = false, features = ["wgsl"] }
metldr-answer-codec = { path = "../metldr-answer-codec" }
metldr-conversation = { path = "../metldr-conversation" }
metldr-history-pages = { path = "../metldr-history-pages" }
serde = { version = "=1.0.229", features = ["derive"] }
js-sys = "=0.3.105"
serde_json = "=1.0.154"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = [
  "console",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioContext",
  "AudioContextState",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "AudioScheduledSourceNode",
  "BiquadFilterNode",
  "BiquadFilterType",
  "Document",
  "DomRect",
  "CssStyleDeclaration",
  "Crypto",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "HtmlOptionElement",
  "HtmlSelectElement",
  "KeyboardEvent",
  "Location",
  "HtmlCollection",
  "HtmlTextAreaElement",
  "GainNode",
  "OscillatorNode",
  "OscillatorType",
  "PageTransitionEvent",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "Headers",
  "Request",
  "RequestInit",
  "RequestRedirect",
  "Response",
  "Storage",
  "Node",
  "NodeList",
  "Text",
  "Url",
  "Window",
] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
